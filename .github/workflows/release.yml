name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win-x64 }
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: macos-latest, platform: mac-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install meson and ninja
        run: pip install meson ninja

      - name: Install nasm
        if: runner.arch == 'X64'
        uses: ilammy/setup-nasm@v1

      - name: Build and pack
        run: sh pack.sh

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.igplugin.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*.igplugin.zip
          --title "$GITHUB_REF_NAME"
          --generate-notes
          ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
