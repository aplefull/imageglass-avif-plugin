[package]
name = "avif-imageglass-plugin"
version = "1.0.0"
edition = "2024"
description = "AVIF codec plugin for ImageGlass, powered by libavif, dav1d and libyuv"
publish = false

[lib]
name = "AvifCodec"
crate-type = ["cdylib"]

[features]
# regenerates src/sys/bindings.rs, needed after bumping libavif in build.rs
regen-bindings = ["dep:bindgen"]

[build-dependencies]
bindgen = { version = "0.73", optional = true }

[profile.release]
lto = true
codegen-units = 1
